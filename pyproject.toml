[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cod-autenticador"
version = "0.1.0"
description = "Componente aislado para validar fuentes y generar códigos TOTP."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cod-autenticador = "cod_autenticador.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
